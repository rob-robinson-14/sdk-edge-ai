# --- Logging: send everything to RTT so the J-Link VCOM (uart20) is binary-clean.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- Arducam dependencies (mirrors applications/person_detection)
CONFIG_SPI=y
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2200
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4

# --- IO
CONFIG_GPIO=y

# --- UART driver: synchronous polled TX is plenty for ~33 KB/frame.
CONFIG_SERIAL=y

# --- Misc
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4096
