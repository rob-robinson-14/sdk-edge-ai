# --- Logging on the J-Link VCOM (no binary streaming here, so we use UART)
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- C++ runtime required by Edge Impulse SDK
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_FP16=n
CONFIG_FPU=y

# --- Edge Impulse SDK
CONFIG_EDGE_IMPULSE_SDK=y

# --- Axon NPU. The interlayer / psum buffer sizes and the model name MUST be
# overridden from the conf_overlay.conf shipped inside the EI deployment zip.
# Build with:
#   west build -- -DEXTRA_CONF_FILE=<unzipped>/conf_overlay.conf
# OR copy the values into a boards/<board>.conf overlay.
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=262144
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# --- Camera (Arducam Mega on SPIM22)
CONFIG_SPI=y
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2200
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4

# --- GPIO for status LED
CONFIG_GPIO=y

# --- Heap. EI's ei_malloc() resolves to picolibc malloc(), NOT k_malloc().
# Picolibc's arena is sized by CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE. The
# Zephyr default of -1 means "use all remaining RAM" which is exactly what
# we want — the DSP block needs a single ~192 KiB allocation
# (1 * EI_CLASSIFIER_NN_INPUT_FRAME_SIZE * sizeof(float)) and assorted
# small ones. We deliberately leave CONFIG_HEAP_MEM_POOL_SIZE at 0 because
# it would steal RAM from picolibc's arena.

# --- Misc
CONFIG_ASSERT=y
# The Nordic Axon inferencing engine puts an int8 input_vector[w*h*channels]
# VLA on the main thread's stack (see edge-impulse-sdk/classifier/
# inferencing_engines/nordic_axon.h). For a 128x128 RGB model that's 48 KiB,
# plus ~8 KiB normal stack usage during inference.
CONFIG_MAIN_STACK_SIZE=65536
